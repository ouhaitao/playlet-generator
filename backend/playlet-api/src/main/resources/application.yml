server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: playlet-generator

  datasource:
    # SQLite 文件库（单用户零运维）；文件落在存储目录下
    url: jdbc:sqlite:${playlet.storage.dir}/playlet.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: none          # schema 由 Flyway 管理
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      # LLM：OpenAI 兼容接口。局域网指向内网 LLM，外网指向公网 API（如 DeepSeek）。
      base-url: ${PLAYLET_LLM_BASE_URL}
      api-key: ${PLAYLET_LLM_API_KEY}
      chat:
        options:
          model: ${PLAYLET_LLM_MODEL}

playlet:
  # 媒体/产物存储根目录（图、视频、音频、成品、SQLite 文件）
  storage:
    dir: ${PLAYLET_STORAGE_DIR}

  # ComfyUI 原生 API 地址
  comfyui:
    base-url: ${PLAYLET_COMFYUI_BASE_URL}
    # ComfyUI 产物输出根目录（实测在 ComfyUI\output\，多一层目录）
    output-dir: ${PLAYLET_COMFYUI_OUTPUT_DIR}
    # ComfyUI 输入素材目录（首帧图审核通过后复制到这里，供图生视频 LoadImage 使用）
    input-dir: ${PLAYLET_COMFYUI_INPUT_DIR}
    # 提交后轮询 history 的间隔与超时
    poll-interval-ms: 1500
    timeout-seconds: 3600

  # ffmpeg 可执行文件路径（不在 PATH 上也能用；见 DESIGN.md §10.7）
  ffmpeg:
    path: ${PLAYLET_FFMPEG_PATH}

  # 视频后端：v1 仅 MiniMax H3
  generation:
    default-backend: MINIMAX_H3
    # 首帧图后端：ANIMA（本地有模型）/ ILLUSTRIOUS（待装 checkpoint）
    default-image-backend: ${PLAYLET_IMAGE_BACKEND}

logging:
  level:
    org.playlet: INFO
